name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit + database security tests
        run: npm test
      - name: Production build
        run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54399
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      - name: No server secrets in browser bundle
        run: npm run check:bundle
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (phone, Android, desktop)
        run: npm run test:e2e
