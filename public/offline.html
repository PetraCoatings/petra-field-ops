<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#173f73" />
    <title>No connection · Petra Field Ops</title>
    <style>
      body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f5f5f5; color: #0a0a0a; }
      header { background: #11305a; color: #fff; padding: calc(env(safe-area-inset-top) + 14px) 16px 14px; font-weight: 700; font-size: 18px; }
      main { max-width: 36rem; margin: 0 auto; padding: 20px 16px; }
      section { background: #fff; border: 1px solid #e5e5e5; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
      h1 { font-size: 24px; margin: 0 0 8px; }
      p { font-size: 17px; line-height: 1.45; margin: 0 0 16px; color: #262626; }
      a.btn { display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 12px; background: #173f73; color: #fff; font-size: 18px; font-weight: 600; text-decoration: none; }
      button { width: 100%; min-height: 48px; margin-top: 10px; border-radius: 12px; border: 2px solid #d4d4d4; background: #fff; font-size: 16px; font-weight: 600; color: #171717; }
    </style>
  </head>
  <body>
    <header>Petra Field Ops</header>
    <main>
      <section lang="en">
        <h1>No connection</h1>
        <p>This page needs a signal. The calculators still work without one.</p>
        <a class="btn" href="/calculators">Open Calculators</a>
        <button type="button" onclick="location.reload()">Try again</button>
      </section>
      <section lang="es">
        <h1>Sin conexión</h1>
        <p>Esta página necesita señal. Las calculadoras funcionan sin ella.</p>
        <a class="btn" href="/calculators">Abrir calculadoras</a>
        <button type="button" onclick="location.reload()">Intentar de nuevo</button>
      </section>
    </main>
  </body>
</html>
